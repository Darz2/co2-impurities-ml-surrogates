[build-system]
requires = ["setuptools>=69", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "co2-impurities-ml-surrogates"
version = "0.1.0"
description = "PC-SAFT cDFT workspace for interfacial tension computations of multicomponent mixtures"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Darshan Raju", email = "d.raju@tudelft.nl" }]
license = { text = "MIT" }
keywords = [
    "PC-SAFT",
    "cDFT",
    "classical-DFT",
    "interfacial-tension",
    "thermodynamics",
    "multicomponent-mixtures",
    "feos",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Development Status :: 3 - Alpha",
]

dependencies = [
    "feos>=0.9.3",
