[build-system]
requires = ["setuptools>=69", "wheel", "build"]
build-backend = "setuptools.build_meta"

[project]
name = "A6"
version = "0.1.0"
description = "PC-SAFT cDFT workspace for interfacial tension computations of multicomponent mixtures"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Darshan Raju", email = "d.raju@tudelft.nl" }]
license = { text = "Proprietary" }
keywords = [
    "PC-SAFT",
    "cDFT",
    "classical-DFT",
    "interfacial-tension",
    "thermodynamics",
    "multicomponent-mixtures",
    "feos",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Development Status :: 3 - Alpha",
]

dependencies = [
    "feos>=0.9.3",
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "molmass==2026.1.8",
    "si-units==0.11.1",
    "sympy==1.14.0",
    "ctREFPROP==0.10.5",
    "scienceplots",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff",
    "black",
    "mypy",
]
test = ["pytest>=8", "pytest-cov>=5"]
docs = ["sphinx", "sphinx-rtd-theme"]
all = [
    "thermoift",
    "Interfacethermopy",
    "parachorpy",
]

[project.urls]
Homepage = "https://github.com/darshan-raju/A6"
Repository = "https://github.com/darshan-raju/A6"

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["PCSAFT_cDFT/thermoift/tests", "PCSAFT_cDFT/Interfacethermopy/tests", "PCSAFT_cDFT/submodule.parachorpy/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.uv.workspace]
members = [
    "PCSAFT_cDFT/symbolic_regression/outputs/manimations",
    "manimations",
]
